<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Neon Snake</title>
<style>
  :root {
    --bg: #0a0a1a;
    --grid: #12122a;
    --snake: #00ffd5;
    --snake-glow: #00ffd5aa;
    --food: #ff3cac;
    --food-glow: #ff3cac88;
    --power: #ffd93c;
    --text: #e8e8ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(ellipse at center, #1a0a2e 0%, var(--bg) 70%);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 16px;
  }
  h1 {
    font-size: clamp(28px, 5vw, 44px);
    letter-spacing: 6px;
    font-weight: 200;
    background: linear-gradient(90deg, #00ffd5, #ff3cac, #ffd93c);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 40px #00ffd533;
  }
  .hud {
    display: flex;
    gap: 28px;
    font-size: 16px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.85;
  }
  .hud span b { color: var(--snake); font-weight: 600; margin-left: 6px; }
  .board-wrap {
    position: relative;
    border-radius: 14px;
    padding: 8px;
    background: linear-gradient(135deg, #00ffd522, #ff3cac22);
    box-shadow: 0 0 40px #00ffd520, 0 0 80px #ff3cac20;
  }
  canvas {
    display: block;
    background: var(--bg);
    border-radius: 8px;
  }
  .overlay {
    position: absolute;
    inset: 8px;
    border-radius: 8px;
    background: rgba(10,10,26,0.85);
    backdrop-filter: blur(6px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
    padding: 20px;
    transition: opacity 0.3s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h2 {
    font-size: 32px;
    font-weight: 300;
    letter-spacing: 4px;
    color: var(--snake);
    text-shadow: 0 0 20px var(--snake-glow);
  }
  .overlay p { font-size: 14px; opacity: 0.75; line-height: 1.6; max-width: 320px; }
  button {
    background: transparent;
    border: 1px solid var(--snake);
    color: var(--snake);
    padding: 12px 28px;
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s;
    font-family: inherit;
  }
  button:hover {
    background: var(--snake);
    color: var(--bg);
    box-shadow: 0 0 20px var(--snake-glow);
  }
  .keys {
    font-size: 12px;
    opacity: 0.6;
    letter-spacing: 1px;
  }
  kbd {
    background: #ffffff12;
    border: 1px solid #ffffff22;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 11px;
    margin: 0 2px;
  }
</style>
</head>
<body>
  <h1>NEON SNAKE</h1>
  <div class="hud">
    <span>Score<b id="score">0</b></span>
    <span>Best<b id="best">0</b></span>
    <span>Level<b id="level">1</b></span>
  </div>
  <div class="board-wrap">
    <canvas id="game" width="480" height="480"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="title">READY?</h2>
      <p id="msg">Eat the pink orbs to grow. Grab golden orbs for bonus points and brief invincibility. Don't bite your tail.</p>
      <button id="start">START</button>
      <div class="keys">
        <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> &nbsp;•&nbsp; <kbd>Space</kbd> to pause
      </div>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const SIZE = 24;
  const COLS = canvas.width / SIZE;
  const ROWS = canvas.height / SIZE;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const levelEl = document.getElementById('level');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('title');
  const msgEl = document.getElementById('msg');
  const startBtn = document.getElementById('start');

  let snake, dir, nextDir, food, power, score, best, level, speed, invincibleUntil, particles, running, paused, lastTick;

  best = parseInt(localStorage.getItem('neon-snake-best') || '0', 10);
  bestEl.textContent = best;

  function reset() {
    snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
    dir = {x: 1, y: 0};
    nextDir = dir;
    score = 0;
    level = 1;
    speed = 120;
    invincibleUntil = 0;
    particles = [];
    placeFood();
    power = null;
    updateHUD();
  }

  function placeFood() {
    while (true) {
      const f = {x: (Math.random() * COLS) | 0, y: (Math.random() * ROWS) | 0};
      if (!snake.some(s => s.x === f.x && s.y === f.y) && !(power && power.x === f.x && power.y === f.y)) {
        food = f;
        return;
      }
    }
  }

  function maybePlacePower() {
    if (power || Math.random() > 0.15) return;
    while (true) {
      const p = {x: (Math.random() * COLS) | 0, y: (Math.random() * ROWS) | 0, ttl: 60};
      if (!snake.some(s => s.x === p.x && s.y === p.y) && !(food.x === p.x && food.y === p.y)) {
        power = p;
        return;
      }
    }
  }

  function updateHUD() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
    levelEl.textContent = level;
  }

  function burst(x, y, color, n = 14) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = 1 + Math.random() * 3;
      particles.push({
        x: x * SIZE + SIZE / 2,
        y: y * SIZE + SIZE / 2,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v,
        life: 1,
        color
      });
    }
  }

  function step() {
    nextDir && (dir = nextDir);
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      if (Date.now() < invincibleUntil) {
        head.x = (head.x + COLS) % COLS;
        head.y = (head.y + ROWS) % ROWS;
      } else return gameOver();
    }

    if (snake.some((s, i) => i > 0 && s.x === head.x && s.y === head.y)) {
      if (Date.now() >= invincibleUntil) return gameOver();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      burst(food.x, food.y, '#ff3cac');
      placeFood();
      maybePlacePower();
      if (score > 0 && score % 50 === 0) {
        level++;
        speed = Math.max(55, speed - 8);
      }
      updateHUD();
    } else {
      snake.pop();
    }

    if (power) {
      if (head.x === power.x && head.y === power.y) {
        score += 25;
        invincibleUntil = Date.now() + 4000;
        burst(power.x, power.y, '#ffd93c', 24);
        power = null;
        updateHUD();
      } else {
        power.ttl--;
        if (power.ttl <= 0) power = null;
      }
    }
  }

  function draw() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#ffffff06';
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * SIZE, 0);
      ctx.lineTo(i * SIZE, canvas.height);
      ctx.stroke();
    }
    for (let i = 1; i < ROWS; i++) {
      ctx.beginPath();
      ctx.moveTo(0, i * SIZE);
      ctx.lineTo(canvas.width, i * SIZE);
      ctx.stroke();
    }

    drawOrb(food.x, food.y, '#ff3cac', '#ff3cac88');
    if (power) {
      const pulse = 0.7 + 0.3 * Math.sin(Date.now() / 150);
      drawOrb(power.x, power.y, '#ffd93c', '#ffd93caa', pulse);
    }

    const invincible = Date.now() < invincibleUntil;
    snake.forEach((s, i) => {
      const t = i / snake.length;
      const hue = invincible ? (Date.now() / 4) % 360 : 170 - t * 20;
      const sat = invincible ? 100 : 100;
      const light = 60 - t * 20;
      ctx.fillStyle = `hsl(${hue},${sat}%,${light}%)`;
      ctx.shadowColor = `hsl(${hue},${sat}%,60%)`;
      ctx.shadowBlur = i === 0 ? 20 : 10;
      const pad = i === 0 ? 2 : 3;
      roundRect(s.x * SIZE + pad, s.y * SIZE + pad, SIZE - pad * 2, SIZE - pad * 2, 5);
      ctx.fill();
    });
    ctx.shadowBlur = 0;

    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.92;
      p.vy *= 0.92;
      p.life -= 0.03;
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function drawOrb(gx, gy, color, glow, scale = 1) {
    const cx = gx * SIZE + SIZE / 2;
    const cy = gy * SIZE + SIZE / 2;
    const r = (SIZE / 2 - 3) * scale;
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 2);
    grad.addColorStop(0, color);
    grad.addColorStop(0.5, glow);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function loop(now) {
    if (!running) return;
    if (!paused) {
      if (now - lastTick >= speed) {
        step();
        lastTick = now;
      }
      draw();
    }
    requestAnimationFrame(loop);
  }

  function start() {
    reset();
    running = true;
    paused = false;
    lastTick = performance.now();
    overlay.classList.add('hidden');
    requestAnimationFrame(loop);
  }

  function gameOver() {
    running = false;
    if (score > best) {
      best = score;
      localStorage.setItem('neon-snake-best', best);
      updateHUD();
    }
    titleEl.textContent = 'GAME OVER';
    msgEl.textContent = `Final score: ${score}  •  Level ${level}${score === best && best > 0 ? '  •  NEW BEST!' : ''}`;
    startBtn.textContent = 'PLAY AGAIN';
    overlay.classList.remove('hidden');
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) {
      titleEl.textContent = 'PAUSED';
      msgEl.textContent = 'Press Space or click Resume to continue.';
      startBtn.textContent = 'RESUME';
      overlay.classList.remove('hidden');
    } else {
      overlay.classList.add('hidden');
      lastTick = performance.now();
      requestAnimationFrame(loop);
    }
  }

  startBtn.addEventListener('click', () => {
    if (paused) togglePause();
    else start();
  });

  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === ' ') { e.preventDefault(); togglePause(); return; }
    if (!running || paused) return;
    const map = {
      arrowup: [0,-1], w: [0,-1],
      arrowdown: [0,1], s: [0,1],
      arrowleft: [-1,0], a: [-1,0],
      arrowright: [1,0], d: [1,0]
    };
    const m = map[k];
    if (!m) return;
    const nd = {x: m[0], y: m[1]};
    if (nd.x === -dir.x && nd.y === -dir.y) return;
    nextDir = nd;
  });

  reset();
  draw();
})();
</script>
</body>
</html>
